services:
  web:
    build: .
    expose:
      - "8001"  # puerto interno donde escucha la app
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
    healthcheck:
      test: ["CMD-SHELL", "python /app/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me}
      - DEBUG=${DEBUG:-0}
      - SQLITE_DB_PATH=/data/gps_monitoring.db
      - REDIS_URL=redis://redis:6379/1
      - MONGO_URI=mongodb://mongodb:27017/gps_monitoring
      - ALLOWED_HOSTS=localhost,127.0.0.1,latitudarg.com,www.latitudarg.com
      - CSRF_TRUSTED_ORIGINS=https://latitudarg.com,https://www.latitudarg.com,http://localhost,http://127.0.0.1
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    volumes:
      - db-data:/data
      - static-data:/app/staticfiles
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"

      # Router principal por dominio
      - "traefik.http.routers.latitudarg.rule=Host(`latitudarg.com`) || Host(`www.latitudarg.com`)"
      - "traefik.http.routers.latitudarg.entrypoints=websecure"
      - "traefik.http.routers.latitudarg.tls=true"
      
      # Middlewares definidos en Traefik externo
      - "traefik.http.routers.latitudarg.middlewares=default-sec-headers@file,gzip-compress@file"

      # Servicio (puerto interno de la app)
      - "traefik.http.routers.latitudarg.service=latitudarg"
      - "traefik.http.services.latitudarg.loadbalancer.server.port=8001"
    networks:
      - traefik_proxy
      - latitudarg_internal
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
        compress: "true"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - latitudarg_internal
    restart: unless-stopped

  mongodb:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - latitudarg_internal
    restart: unless-stopped

volumes:
  db-data:
  static-data:
  mongo-data:

networks:
  traefik_proxy:
    external: true
  latitudarg_internal:
    driver: bridge