services:
  web:
    build: .
    expose:
      - "8001"  # puerto interno donde escucha la app
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          python -c "import urllib.request,sys; import socket; socket.setdefaulttimeout(2);
          import urllib.error;
          import time;
          url='http://127.0.0.1:8001/login';
          import os;
          try: urllib.request.urlopen(url); sys.exit(0)
          except Exception as e: sys.exit(1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me}
      - DEBUG=${DEBUG:-0}
      - SQLITE_DB_PATH=/data/gps_monitoring.db
      - REDIS_URL=redis://redis:6379/1
      - MONGO_URI=mongodb://mongodb:27017/gps_monitoring
      - ALLOWED_HOSTS=localhost,127.0.0.1,latitudarg.com,www.latitudarg.com
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    volumes:
      - db-data:/data
      - static-data:/app/staticfiles
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"

      # Router principal por dominio
      - "traefik.http.routers.latitudarg.rule=Host(`latitudarg.com`) || Host(`www.latitudarg.com`)"
      - "traefik.http.routers.latitudarg.entrypoints=websecure"
      - "traefik.http.routers.latitudarg.tls=true"
      - "traefik.http.routers.latitudarg.tls.options=default@file"

      # Middlewares definidos en Traefik externo
      - "traefik.http.routers.latitudarg.middlewares=default-sec-headers@file,gzip-compress@file"

      # Servicio (puerto interno de la app)
      - "traefik.http.routers.latitudarg.service=latitudarg"
      - "traefik.http.services.latitudarg.loadbalancer.server.port=8001"
    networks:
      - traefik_proxy
      - latitudarg_internal
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - latitudarg_internal
    restart: unless-stopped

  mongodb:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - latitudarg_internal
    restart: unless-stopped

volumes:
  db-data:
  static-data:
  mongo-data:

networks:
  traefik_proxy:
    external: true
  latitudarg_internal:
    driver: bridge