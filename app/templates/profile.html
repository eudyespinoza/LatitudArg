{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7 col-xl-6">
    <div class="card shadow-sm border-0 mb-4">
      <div class="card-body p-4">
        <div class="d-flex align-items-center gap-3 mb-4">
          <div class="rounded-circle bg-primary-subtle d-flex align-items-center justify-content-center" style="width:56px;height:56px;flex-shrink:0">
            <i class="bi bi-person-fill fs-3 text-primary"></i>
          </div>
          <div>
            <h2 class="mb-0 fw-semibold" style="font-size:1.25rem">{{ request.user.username }}</h2>
            <span class="text-muted small">{{ request.user.email }}</span>
          </div>
        </div>

        <form method="POST" action="{{ url_for('main.profile') }}">
          {{ csrf_field() }}

          <p class="section-title"><i class="bi bi-person me-1"></i>Datos de cuenta</p>
          <div class="mb-3">
            <label for="username" class="form-label">Usuario</label>
            <input type="text" class="form-control" id="username" name="username"
                   value="{{ request.user.username }}" readonly>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Correo</label>
            <input type="email" class="form-control" id="email" name="email"
                   value="{{ request.user.email }}" readonly>
          </div>
          <div class="mb-4">
            <label for="keyword" class="form-label">Palabra Clave</label>
            <input type="text" class="form-control" id="keyword" name="keyword"
                   value="{{ request.user.keyword or '' }}" placeholder="Sin palabra clave">
            <div class="form-text">Identificador opcional para recupero de cuenta.</div>
          </div>

          <p class="section-title"><i class="bi bi-key me-1"></i>Cambiar Contraseña</p>
          <div class="mb-3">
            <label for="current_password" class="form-label">Contraseña Actual</label>
            <input type="password" class="form-control" id="current_password" name="current_password"
                   placeholder="Ingresá tu contraseña actual" autocomplete="current-password">
          </div>
          <div class="mb-3">
            <label for="new_password" class="form-label">Nueva Contraseña</label>
            <input type="password" class="form-control" id="new_password" name="new_password"
                   placeholder="Mínimo 6 caracteres" autocomplete="new-password">
          </div>
          <div class="mb-4">
            <label for="confirm_password" class="form-label">Confirmar Nueva Contraseña</label>
            <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                   placeholder="Repetí la nueva contraseña" autocomplete="new-password">
          </div>

          <button type="submit" class="btn btn-primary w-100 fw-semibold transition">
            <i class="bi bi-check2-circle me-2"></i>Guardar Cambios
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
