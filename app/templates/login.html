{% extends 'base.html' %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <i class="bi bi-shield-lock-fill fs-1 text-primary"></i>
          <h2 class="mt-2 mb-0 fw-semibold">Iniciar Sesión</h2>
          <p class="text-muted small mt-1">Ingresa a tu cuenta de LatitudArg</p>
        </div>
        <form method="POST" action="{{ url_for('main.login') }}">
          {{ csrf_field() }}
          <div class="mb-3">
            <label for="username" class="form-label fw-500">Usuario</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control" id="username" name="username"
                     placeholder="Tu nombre de usuario" autocomplete="username" required autofocus>
            </div>
          </div>
          <div class="mb-4">
            <label for="password" class="form-label fw-500">Contraseña</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="password" name="password"
                     placeholder="Tu contraseña" autocomplete="current-password" required>
              <button type="button" class="btn btn-outline-secondary" id="togglePwd" tabindex="-1" title="Mostrar contraseña">
                <i class="bi bi-eye" id="togglePwdIcon"></i>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 fw-semibold transition">
            <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
          </button>
        </form>
        <hr class="my-4">
        <p class="text-center text-muted small mb-0">
          ¿Necesítas acceso?
          <a href="{{ url_for('main.index') }}?landing=1#contact" class="transition fw-semibold">Escribinos</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  document.getElementById('togglePwd').addEventListener('click', function() {
    const pwd = document.getElementById('password');
    const icon = document.getElementById('togglePwdIcon');
    if (pwd.type === 'password') {
      pwd.type = 'text';
      icon.className = 'bi bi-eye-slash';
    } else {
      pwd.type = 'password';
      icon.className = 'bi bi-eye';
    }
  });
</script>
{% endblock %}
